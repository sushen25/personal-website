service: my-website-backend

frameworkVersion: '4'

provider:
  name: aws
  runtime: python3.11
  region: ap-southeast-2
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 29
  environment:
    STAGE: ${self:provider.stage}
    CHAT_CONVERSATIONS_TABLE: ${self:provider.stage}-portfolio-chat-conversations
    BLOG_POSTS_TABLE: ${self:provider.stage}-portfolio-blog-posts
    ANALYTICS_TABLE: ${self:provider.stage}-portfolio-analytics
    PYTHONPATH: /var/task:/opt/python
  iam:
    role:
      statements:
        # DynamoDB permissions
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-portfolio-*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-portfolio-*/index/*
        # Secrets Manager permissions
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - arn:aws:secretsmanager:${self:provider.region}:*:secret:${self:provider.stage}/portfolio/*

functions:
  api:
    handler: src.main.handler
    layers:
      - Ref: PythonRequirementsLambdaLayer
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false
      - http:
          path: /
          method: ANY
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false

custom:
  pythonRequirements:
    dockerizePip: true
    layer: true
    slim: true
    strip: false
    slimPatterns:
      - '**/*.py[c|o]'
      - '**/__pycache__*'
      - '**/*.dist-info*'
      - '**/*.egg-info*'
      - '**/tests/**'
      - '**/test/**'
    noDeploy:
      - pytest
      - pytest-cov
      - mypy
      - boto3
      - botocore
      - s3transfer

package:
  patterns:
    - '!venv/**'
    - '!.venv/**'
    - '!node_modules/**'
    - '!.serverless/**'
    - '!.pytest_cache/**'
    - '!tests/**'
    - '!*.md'
    - '!.git/**'
    - '!.env*'
    - '!__pycache__/**'
    - '!.requirements.zip'
    - '!unzip_requirements.py'
    - 'src/**'

resources:
  Resources:
    # Chat Conversations Table
    ChatConversationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.stage}-portfolio-chat-conversations
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: sessionId
            AttributeType: S
          - AttributeName: timestamp
            AttributeType: N
          - AttributeName: createdDate
            AttributeType: S
        KeySchema:
          - AttributeName: sessionId
            KeyType: HASH
          - AttributeName: timestamp
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: CreatedDateIndex
            KeySchema:
              - AttributeName: createdDate
                KeyType: HASH
              - AttributeName: timestamp
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES

