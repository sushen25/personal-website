service: agent-service

frameworkVersion: '4'

provider:
  name: aws
  runtime: python3.11
  region: ap-southeast-2
  stage: ${opt:stage, 'dev'}
  memorySize: 1024
  timeout: 60
  environment:
    STAGE: ${self:provider.stage}
    CHAT_CONVERSATIONS_TABLE: ${self:provider.stage}-portfolio-chat-conversations
    BLOG_POSTS_TABLE: ${self:provider.stage}-portfolio-blog-posts
    ANALYTICS_TABLE: ${self:provider.stage}-portfolio-analytics
    PYTHONPATH: /var/task
  iam:
    role:
      statements:
        # DynamoDB permissions (for tool data access)
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-portfolio-*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.stage}-portfolio-*/index/*
        # Secrets Manager permissions (for API keys)
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - arn:aws:secretsmanager:${self:provider.region}:*:secret:${self:provider.stage}/portfolio/*

functions:
  agent:
    handler: src.main.handler
    description: Strands Agent service for portfolio chatbot
    # No HTTP events - invoked directly by backend Lambda
    events: []

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true
    layer: false
    zip: true
    slim: true
    strip: false
    noDeploy:
      - pytest
      - pytest-cov
      - mypy

package:
  patterns:
    - '!node_modules/**'
    - '!venv/**'
    - '!.pytest_cache/**'
    - '!tests/**'
    - '!*.md'
